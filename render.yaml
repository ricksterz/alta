services:
  - type: web
    name: alta-server
    runtime: node
    plan: free
    # --include=dev overrides npm's default of skipping devDependencies when
    # NODE_ENV=production is set (which it is, below, for the app's own use
    # at runtime — cookie `secure` flag). Without it, typescript/@types/node
    # never install and the build fails before it can even run tsc.
    buildCommand: npm install --include=dev && npx prisma generate --schema packages/server/prisma/schema.prisma && npm run build --workspace packages/server
    startCommand: npx prisma migrate deploy --schema packages/server/prisma/schema.prisma && npm run prisma:seed-if-empty --workspace packages/server && node packages/server/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      # Hosted on Neon rather than Render: Render's free Postgres is deleted
      # 30 days after creation, Neon's free tier has no expiry. Use Neon's
      # direct (non-pooled) connection string — `prisma migrate deploy` runs
      # at startup and needs a session-level connection.
      - key: DATABASE_URL
        sync: false
      - key: SESSION_TTL_HOURS
        value: "24"
      - key: TIN_ENCRYPTION_KEY
        sync: false
      - key: ANVIL_API_KEY
        sync: false
      - key: WEB_ORIGIN
        sync: false
